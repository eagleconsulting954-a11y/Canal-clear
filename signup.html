<html lang="en">
<head>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Your Account — CanalClear</title>
  <meta name="description" content="Set up your CanalClear account to start automating canal transit compliance filings.">
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" type="image/png" href="/icons/icon-192.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --navy:        #0d1b2e;
      --navy-mid:    #142238;
      --navy-card:   #1a2e48;
      --navy-border: #243652;
      --orange:      #d4622b;
      --orange-lt:   #e8743e;
      --orange-pale: rgba(212, 98, 43, 0.12);
      --teal:        #d4622b;
      --text:        #e8eef4;
      --muted:       #8fa3b8;
      --muted-lt:    #b8c8d8;
      --white:       #ffffff;
      --green:       #22c55e;
      --red:         #ef4444;
      --gray:        #8fa3b8;
      --radius:      12px;
    }

    html { scroll-behavior: smooth; }

    body {
      font-family: 'IBM Plex Sans', 'Helvetica Neue', Helvetica, Arial, sans-serif;
      background: var(--navy);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      -webkit-font-smoothing: antialiased;
    }

    /* ── Brand bar ──────────────────────────────────────────────────────── */
    .brand-bar {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 16px 24px;
      border-bottom: 1px solid var(--navy-border);
    }
    .brand-logo {
      font-size: 15px;
      font-weight: 700;
      color: var(--orange);
      letter-spacing: -0.3px;
      text-decoration: none;
    }
    .brand-tagline { font-size: 12px; color: var(--muted); }
    .brand-sep { color: var(--navy-border); }

    /* ── Main layout ────────────────────────────────────────────────────── */
    .page-wrap {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 48px 24px 80px;
    }

    .auth-card {
      background: var(--navy-mid);
      border: 1px solid var(--navy-border);
      border-radius: 16px;
      padding: 40px 36px;
      width: 100%;
      max-width: 440px;
    }

    @media (max-width: 480px) {
      .auth-card { padding: 28px 20px; }
    }

    .card-title {
      font-size: 22px;
      font-weight: 700;
      color: var(--white);
      margin-bottom: 6px;
      letter-spacing: -0.3px;
    }
    .card-subtitle {
      font-size: 13px;
      color: var(--muted);
      margin-bottom: 28px;
      line-height: 1.55;
    }
    .card-subtitle a { color: var(--orange); text-decoration: none; }
    .card-subtitle a:hover { text-decoration: underline; }

    /* ── Form ───────────────────────────────────────────────────────────── */
    .form-group {
      margin-bottom: 16px;
    }
    .form-group label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      color: var(--muted-lt);
      margin-bottom: 6px;
      letter-spacing: 0.3px;
    }
    .form-group input {
      width: 100%;
      background: var(--navy);
      border: 1.5px solid var(--navy-border);
      border-radius: 8px;
      padding: 12px 14px;
      font-size: 14px;
      font-family: inherit;
      color: var(--text);
      outline: none;
      transition: border-color 0.15s;
    }
    .form-group input::placeholder { color: var(--muted); }
    .form-group input:focus { border-color: var(--orange); }
    .form-group input.error { border-color: var(--red); animation: shake 0.35s ease; }

    @keyframes shake {
      0%,100% { transform: translateX(0); }
      20%      { transform: translateX(-5px); }
      40%      { transform: translateX(5px); }
      60%      { transform: translateX(-4px); }
      80%      { transform: translateX(4px); }
    }

    .optional-label {
      color: var(--gray);
      font-weight: 400;
      font-size: 0.8rem;
    }

    .btn-submit {
      width: 100%;
      background: var(--orange);
      color: #fff;
      border: none;
      border-radius: 10px;
      padding: 14px 20px;
      font-size: 15px;
      font-weight: 700;
      font-family: inherit;
      cursor: pointer;
      transition: background 0.15s, transform 0.1s;
      margin-top: 4px;
    }
    .btn-submit:hover { background: var(--orange-lt); }
    .btn-submit:active { transform: scale(0.98); }
    .btn-submit:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }

    /* ── Messages ───────────────────────────────────────────────────────── */
    .error-msg {
      background: rgba(239, 68, 68, 0.1);
      border: 1px solid rgba(239, 68, 68, 0.3);
      border-radius: 8px;
      padding: 10px 14px;
      font-size: 13px;
      color: #fca5a5;
      margin-bottom: 16px;
      display: none;
    }
    .success-msg {
      background: rgba(34, 197, 94, 0.1);
      border: 1px solid rgba(34, 197, 94, 0.3);
      border-radius: 8px;
      padding: 10px 14px;
      font-size: 13px;
      color: #86efac;
      margin-bottom: 16px;
      display: none;
    }

    /* ── Divider ────────────────────────────────────────────────────────── */
    .divider {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 20px 0;
      color: var(--muted);
      font-size: 12px;
    }
    .divider::before, .divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--navy-border);
    }

    /* ── Bottom link ────────────────────────────────────────────────────── */
    .bottom-link {
      text-align: center;
      font-size: 13px;
      color: var(--muted);
      margin-top: 20px;
    }
    .bottom-link a { color: var(--orange); text-decoration: none; }
    .bottom-link a:hover { text-decoration: underline; }

    /* ── Pricing nudge ──────────────────────────────────────────────────── */
    .pricing-nudge {
      background: var(--orange-pale);
      border: 1px solid rgba(212, 98, 43, 0.25);
      border-radius: 10px;
      padding: 14px 16px;
      margin-top: 20px;
      font-size: 13px;
      color: var(--text);
      line-height: 1.55;
      text-align: center;
    }
    .pricing-nudge a {
      color: var(--orange);
      font-weight: 600;
      text-decoration: none;
    }
    .pricing-nudge a:hover { text-decoration: underline; }

    /* ── Footer ─────────────────────────────────────────────────────────── */
    footer {
      padding: 24px;
      border-top: 1px solid var(--navy-border);
      text-align: center;
      font-size: 12px;
      color: var(--muted);
    }
    footer a { color: var(--orange); text-decoration: none; }
  </style>
</head>
<body>

  <header class="brand-bar">
    <a href="https://canalclear.org" class="brand-logo">CanalClear</a>
    <span class="brand-sep">·</span>
    <span class="brand-tagline">Maritime Compliance Automation</span>
  </header>

  <div class="page-wrap">
    <div class="auth-card">

      <h1 class="card-title">Create your account</h1>
      <p class="card-subtitle">
        Already have an account? <a href="/login">Sign in →</a>
      </p>

      <div class="error-msg" id="error-msg"></div>
      <div class="success-msg" id="success-msg"></div>

      <form id="signup-form">
        <div class="form-group">
          <label for="signup-name">Your name <span class="optional-label">(optional)</span></label>
          <input type="text" id="signup-name" name="name" placeholder="Captain Jane Smith" autocomplete="name">
        </div>
        <div class="form-group">
          <label for="signup-email">Work email <span style="color:var(--red)">*</span></label>
          <input type="email" id="signup-email" name="email" placeholder="you@vesselcorp.com" required autocomplete="email">
        </div>
        <div class="form-group">
          <label for="signup-password">Create password <span style="color:var(--red)">*</span></label>
          <input type="password" id="signup-password" name="password" placeholder="Min 8 characters" required autocomplete="new-password" minlength="8">
        </div>

        <button type="submit" class="btn-submit" id="submit-btn">Create Account →</button>
      </form>

      <div class="divider">or</div>

      <div class="pricing-nudge">
        New to CanalClear? <a href="/pricing">View plans →</a><br>
        Your account activates automatically after purchase.
      </div>

      <div class="bottom-link">
        <a href="/login">Back to sign in</a>
      </div>

    </div>
  </div>

  <footer>
    © 2026 CanalClear ·
    <a href="/privacy">Privacy</a> ·
    <a href="/terms">Terms</a>
  </footer>

  <script>
    // Pre-fill email from query param (e.g. from pricing redirect)
    (function() {
      var params = new URLSearchParams(window.location.search);
      var emailParam = params.get('email');
      if (emailParam) {
        var el = document.getElementById('signup-email');
        if (el) el.value = decodeURIComponent(emailParam);
      }
    })();

    var form = document.getElementById('signup-form');
    var errorEl = document.getElementById('error-msg');
    var successEl = document.getElementById('success-msg');
    var submitBtn = document.getElementById('submit-btn');

    function showError(msg) {
      errorEl.textContent = msg;
      errorEl.style.display = 'block';
      successEl.style.display = 'none';
      setTimeout(function() { errorEl.style.display = 'none'; }, 10000);
    }

    function showSuccess(msg) {
      successEl.textContent = msg;
      successEl.style.display = 'block';
      errorEl.style.display = 'none';
    }

    form.addEventListener('submit', async function(e) {
      e.preventDefault();

      var name = document.getElementById('signup-name').value.trim();
      var email = document.getElementById('signup-email').value.trim();
      var password = document.getElementById('signup-password').value;

      if (!email || !email.includes('@')) {
        var emailInput = document.getElementById('signup-email');
        emailInput.classList.add('error');
        setTimeout(function() { emailInput.classList.remove('error'); }, 600);
        showError('Please enter a valid work email address.');
        return;
      }

      if (password.length < 8) {
        var pwInput = document.getElementById('signup-password');
        pwInput.classList.add('error');
        setTimeout(function() { pwInput.classList.remove('error'); }, 600);
        showError('Password must be at least 8 characters.');
        return;
      }

      submitBtn.disabled = true;
      submitBtn.textContent = 'Creating account…';

      try {
        var res = await fetch('/api/auth/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email: email, password: password, name: name || undefined }),
        });

        var data = await res.json();

        if (data.success) {
          if (typeof fbq !== 'undefined') fbq('track', 'CompleteRegistration');
          if (typeof gtag !== 'undefined') gtag('event', 'sign_up', { method: 'email' });

          showSuccess('Account created! Taking you to the dashboard…');
          submitBtn.textContent = 'Redirecting…';

          setTimeout(function() {
            window.location.href = data.redirect || '/app';
          }, 800);
        } else {
          // Subscription required — redirect to pricing
          if (data.redirect === '/pricing' || (data.message && data.message.includes('subscription'))) {
            showError(data.message || 'No active subscription found. Please purchase a plan first.');
            submitBtn.disabled = false;
            submitBtn.textContent = 'Create Account →';

            // Show a pricing button after 1.5s
            setTimeout(function() {
              var pricingBtn = document.createElement('a');
              pricingBtn.href = '/pricing?email=' + encodeURIComponent(email);
              pricingBtn.style.cssText = 'display:block;margin-top:14px;text-align:center;padding:12px;background:var(--orange);color:#fff;border-radius:10px;font-weight:700;font-size:14px;text-decoration:none;';
              pricingBtn.textContent = 'View Plans & Purchase →';
              form.appendChild(pricingBtn);
            }, 1500);
          } else {
            showError(data.message || 'Account creation failed. Please try again.');
            submitBtn.disabled = false;
            submitBtn.textContent = 'Create Account →';
          }
        }
      } catch (err) {
        showError('Something went wrong. Please try again or contact support.');
        submitBtn.disabled = false;
        submitBtn.textContent = 'Create Account →';
      }
    });
  </script>
</body>
</html>
