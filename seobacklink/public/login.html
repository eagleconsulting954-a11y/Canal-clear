<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Log in — SeoBacklink</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/main.css">
</head>
<body>
<div class="auth-page">
  <div class="auth-card">
    <div class="auth-logo">Seo<span>Backlink</span></div>
    <h1>Welcome back</h1>
    <p class="subtitle">Sign in to your account</p>
    <div id="alert" class="alert alert-error"></div>
    <form id="loginForm">
      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" placeholder="you@company.com" required autocomplete="email">
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="••••••••" required autocomplete="current-password">
      </div>
      <button type="submit" class="btn-primary btn-full" id="submitBtn">Sign in</button>
    </form>
    <div class="auth-footer" style="margin-top:14px">
      <a href="/reset-password" style="color:var(--muted); font-size:0.8rem">Forgot password?</a>
    </div>
    <div class="auth-footer">Don't have an account? <a href="/register">Sign up free</a></div>
  </div>
</div>
<script src="/js/app.js"></script>
<script>
document.getElementById('loginForm').addEventListener('submit', async e => {
  e.preventDefault();
  const btn = document.getElementById('submitBtn');
  const alert = document.getElementById('alert');
  btn.disabled = true; btn.textContent = 'Signing in…';
  hide(alert);
  try {
    await api('POST', '/api/auth/login', {
      email: document.getElementById('email').value,
      password: document.getElementById('password').value,
    });
    window.location.href = '/dashboard';
  } catch (err) {
    showAlert(alert, err.message);
    btn.disabled = false; btn.textContent = 'Sign in';
  }
});
</script>
</body>
</html>
