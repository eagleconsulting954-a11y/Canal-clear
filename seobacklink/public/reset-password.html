<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reset password — SeoBacklink</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/main.css">
</head>
<body>
<div class="auth-page">
  <div class="auth-card" id="forgotCard">
    <div class="auth-logo">Seo<span>Backlink</span></div>
    <h1>Forgot password?</h1>
    <p class="subtitle">Enter your email and we'll send a reset link</p>
    <div id="alert1" class="alert alert-error"></div>
    <form id="forgotForm">
      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" placeholder="you@company.com" required>
      </div>
      <button type="submit" class="btn-primary btn-full" id="forgotBtn">Send reset link</button>
    </form>
    <div class="auth-footer"><a href="/login">Back to sign in</a></div>
  </div>
  <div class="auth-card" id="resetCard" style="display:none">
    <div class="auth-logo">Seo<span>Backlink</span></div>
    <h1>Set new password</h1>
    <p class="subtitle">Choose a strong password</p>
    <div id="alert2" class="alert alert-error"></div>
    <form id="resetForm">
      <div class="form-group">
        <label for="newPassword">New password</label>
        <input type="password" id="newPassword" placeholder="Min. 8 characters" required>
      </div>
      <button type="submit" class="btn-primary btn-full" id="resetBtn">Update password</button>
    </form>
  </div>
</div>
<script src="/js/app.js"></script>
<script>
const token = new URLSearchParams(window.location.search).get('token');
if (token) { hide($('forgotCard')); show($('resetCard')); }

$('forgotForm').addEventListener('submit', async e => {
  e.preventDefault();
  const btn = $('forgotBtn');
  btn.disabled = true; btn.textContent = 'Sending…';
  hide($('alert1'));
  try {
    await api('POST', '/api/auth/forgot-password', { email: $('email').value });
    showAlert($('alert1'), 'Check your email for a reset link.', 'success');
  } catch (err) {
    showAlert($('alert1'), err.message);
  } finally {
    btn.disabled = false; btn.textContent = 'Send reset link';
  }
});

$('resetForm').addEventListener('submit', async e => {
  e.preventDefault();
  const btn = $('resetBtn');
  btn.disabled = true; btn.textContent = 'Updating…';
  hide($('alert2'));
  try {
    await api('POST', '/api/auth/reset-password', { token, password: $('newPassword').value });
    window.location.href = '/login';
  } catch (err) {
    showAlert($('alert2'), err.message);
    btn.disabled = false; btn.textContent = 'Update password';
  }
});
</script>
</body>
</html>
