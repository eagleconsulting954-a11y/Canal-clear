<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign up — SeoBacklink</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/main.css">
</head>
<body>
<div class="auth-page">
  <div class="auth-card">
    <div class="auth-logo">Seo<span>Backlink</span></div>
    <h1>Create your account</h1>
    <p class="subtitle">Free forever — 2 articles included</p>
    <div id="alert" class="alert alert-error"></div>
    <form id="registerForm">
      <div class="form-group">
        <label for="name">Full name</label>
        <input type="text" id="name" placeholder="Jane Smith" required autocomplete="name">
      </div>
      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" placeholder="you@company.com" required autocomplete="email">
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="Min. 8 characters" required autocomplete="new-password">
      </div>
      <button type="submit" class="btn-primary btn-full" id="submitBtn">Create account</button>
    </form>
    <div class="auth-footer">Already have an account? <a href="/login">Sign in</a></div>
  </div>
</div>
<script src="/js/app.js"></script>
<script>
document.getElementById('registerForm').addEventListener('submit', async e => {
  e.preventDefault();
  const btn = document.getElementById('submitBtn');
  const alert = document.getElementById('alert');
  btn.disabled = true; btn.textContent = 'Creating account…';
  hide(alert);
  try {
    await api('POST', '/api/auth/register', {
      name: document.getElementById('name').value,
      email: document.getElementById('email').value,
      password: document.getElementById('password').value,
    });
    window.location.href = '/dashboard';
  } catch (err) {
    showAlert(alert, err.message);
    btn.disabled = false; btn.textContent = 'Create account';
  }
});
</script>
</body>
</html>
