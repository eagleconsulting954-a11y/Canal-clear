<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password — CanalClear</title>
    <meta name="robots" content="noindex, nofollow">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --navy: #1a2d4a;
            --deep: #142238;
            --slate: #243350;
            --teal: #E85A00;
            --teal-dim: rgba(232, 90, 0, 0.12);
            --white: #ffffff;
            --gray: #6b7c93;
            --light: #8fa3b8;
            --red: #FF6B6B;
            --red-dim: rgba(255, 107, 107, 0.12);
        }
        html { scroll-behavior: smooth; }
        body {
            font-family: 'IBM Plex Sans', sans-serif;
            background: var(--navy);
            color: var(--white);
            min-height: 100vh;
            display: flex; align-items: center; justify-content: center;
        }
        .auth-card {
            width: 100%; max-width: 440px;
            background: var(--deep);
            border: 1px solid rgba(255,255,255,0.06);
            border-radius: 20px;
            padding: 2.5rem;
            margin: 1rem;
        }
        .auth-logo { text-align: center; margin-bottom: 2rem; }
        .auth-logo a { text-decoration: none; }
        .logo-text { font-family: 'IBM Plex Sans', sans-serif; font-size: 1.4rem; font-weight: 700; color: var(--white); }
        .logo-dot { color: var(--teal); }

        h1 { font-family: 'IBM Plex Sans', sans-serif; font-size: 1.5rem; font-weight: 600; text-align: center; margin-bottom: 0.5rem; }
        .subtitle { color: var(--gray); font-size: 0.9rem; text-align: center; margin-bottom: 2rem; }

        .form-group { margin-bottom: 1.25rem; }
        label { display: block; font-size: 0.85rem; font-weight: 500; color: var(--light); margin-bottom: 0.5rem; }
        input {
            width: 100%;
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 10px;
            padding: 0.85rem 1rem;
            color: var(--white);
            font-family: 'IBM Plex Sans', sans-serif; font-size: 1rem;
            outline: none; transition: border-color 0.2s;
        }
        input:focus { border-color: var(--teal); background: rgba(232, 90, 0, 0.04); }
        input::placeholder { color: var(--gray); }

        .btn-submit {
            width: 100%;
            background: var(--teal); color: var(--navy);
            border: none; border-radius: 10px;
            padding: 0.9rem;
            font-family: 'IBM Plex Sans', sans-serif; font-size: 1rem; font-weight: 600;
            cursor: pointer; transition: all 0.2s;
            margin-top: 0.5rem;
        }
        .btn-submit:hover { background: #FF8533; transform: translateY(-1px); }
        .btn-submit:disabled { background: rgba(232, 90, 0, 0.4); cursor: not-allowed; transform: none; }

        .error-msg {
            background: var(--red-dim);
            border: 1px solid rgba(255, 107, 107, 0.2);
            color: var(--red);
            border-radius: 8px; padding: 0.75rem 1rem;
            font-size: 0.875rem; margin-bottom: 1rem; display: none;
        }
        .error-msg.visible { display: block; }
        .success-msg {
            background: var(--teal-dim);
            border: 1px solid rgba(232, 90, 0, 0.2);
            color: var(--teal);
            border-radius: 8px; padding: 0.75rem 1rem;
            font-size: 0.875rem; margin-bottom: 1rem; display: none;
        }
        .success-msg.visible { display: block; }

        .bottom-links { text-align: center; font-size: 0.875rem; color: var(--gray); margin-top: 1.5rem; }
        .bottom-links a { color: var(--teal); text-decoration: none; font-weight: 600; }
        .bottom-links a:hover { text-decoration: underline; }

        .invalid-token {
            text-align: center;
            padding: 1rem 0;
        }
        .invalid-token p { color: var(--gray); font-size: 0.9rem; margin-bottom: 1rem; }
    </style>
</head>
<body>
    <div class="auth-card">
        <div class="auth-logo">
            <a href="/"><span class="logo-text">Canal<span class="logo-dot">Clear</span></span></a>
        </div>

        <h1>Set new password</h1>
        <p class="subtitle">Choose a strong password for your admin account.</p>

        <div id="error-msg" class="error-msg"></div>
        <div id="success-msg" class="success-msg"></div>

        <form id="reset-form">
            <div class="form-group">
                <label for="password">New password</label>
                <input type="password" id="password" name="password" placeholder="At least 8 characters" required autocomplete="new-password" minlength="8">
            </div>
            <div class="form-group">
                <label for="confirm">Confirm new password</label>
                <input type="password" id="confirm" name="confirm" placeholder="Re-enter your password" required autocomplete="new-password" minlength="8">
            </div>
            <button type="submit" class="btn-submit" id="submit-btn">Update Password →</button>
        </form>

        <div class="bottom-links">
            <a href="/login">← Back to login</a>
        </div>
    </div>

    <script>
        const params = new URLSearchParams(window.location.search);
        const token = params.get('token');

        const form = document.getElementById('reset-form');
        const errorMsg = document.getElementById('error-msg');
        const successMsg = document.getElementById('success-msg');
        const submitBtn = document.getElementById('submit-btn');

        // No token in URL — show error immediately
        if (!token) {
            form.style.display = 'none';
            errorMsg.textContent = 'This reset link is invalid or missing a token. Please request a new one.';
            errorMsg.classList.add('visible');
        }

        function showError(msg) {
            errorMsg.textContent = msg;
            errorMsg.classList.add('visible');
            successMsg.classList.remove('visible');
        }
        function showSuccess(msg) {
            successMsg.textContent = msg;
            successMsg.classList.add('visible');
            errorMsg.classList.remove('visible');
        }

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const password = document.getElementById('password').value;
            const confirm = document.getElementById('confirm').value;

            if (password !== confirm) {
                return showError('Passwords do not match.');
            }
            if (password.length < 8) {
                return showError('Password must be at least 8 characters.');
            }

            submitBtn.disabled = true;
            submitBtn.textContent = 'Updating…';
            errorMsg.classList.remove('visible');

            try {
                const res = await fetch('/api/auth/reset-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ token, password })
                });
                const data = await res.json();

                if (data.success) {
                    showSuccess('Password updated! Redirecting to login…');
                    form.style.display = 'none';
                    setTimeout(() => {
                        window.location.href = '/login?reset=success';
                    }, 1800);
                } else {
                    showError(data.message || 'Failed to update password. Please try again.');
                    submitBtn.disabled = false;
                    submitBtn.textContent = 'Update Password →';
                }
            } catch (err) {
                showError('Network error. Please try again.');
                submitBtn.disabled = false;
                submitBtn.textContent = 'Update Password →';
            }
        });
    </script>
<script src="/js/whatsapp-button.js"></script>
</body>
</html>
