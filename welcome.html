    <style>
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --navy: #1a2d4a;
            --deep: #142238;
            --slate: #243350;
            --teal: #E85A00;
            --teal-dim: rgba(232, 90, 0, 0.12);
            --white: #ffffff;
            --gray: #6b7c93;
            --light: #8fa3b8;
            --red: #FF6B6B;
            --red-dim: rgba(255, 107, 107, 0.12);
        }
        html { scroll-behavior: smooth; }
        body {
            font-family: 'IBM Plex Sans', sans-serif;
            background: var(--navy);
            color: var(--white);
            min-height: 100vh;
            display: flex; align-items: center; justify-content: center;
        }

        .auth-card {
            width: 100%; max-width: 460px;
            background: var(--deep);
            border: 1px solid rgba(255,255,255,0.06);
            border-radius: 20px; padding: 2.5rem;
            margin: 1rem;
        }
        .auth-logo { text-align: center; margin-bottom: 1.5rem; }
        .auth-logo a { text-decoration: none; }
        .logo-text { font-family: 'IBM Plex Sans', sans-serif; font-size: 1.4rem; font-weight: 700; color: var(--white); }
        .logo-dot { color: var(--teal); }

        .success-icon {
            text-align: center; font-size: 3rem; margin-bottom: 1rem;
        }
        h1 { font-family: 'IBM Plex Sans', sans-serif; font-size: 1.5rem; font-weight: 600; text-align: center; margin-bottom: 0.5rem; }
        .subtitle { color: var(--gray); font-size: 0.9rem; text-align: center; margin-bottom: 2rem; line-height: 1.5; }
        .subtitle strong { color: var(--teal); }

        .plan-pill {
            display: inline-block;
            background: var(--teal-dim); border: 1px solid rgba(232, 90, 0, 0.2);
            color: var(--teal); font-size: 0.8rem; font-weight: 600;
            padding: 0.25rem 0.75rem; border-radius: 100px;
            margin: 0 auto 1.5rem; display: block; text-align: center; width: fit-content; margin: 0 auto 1.5rem;
        }

        .form-group { margin-bottom: 1.25rem; }
        label { display: block; font-size: 0.85rem; font-weight: 500; color: var(--light); margin-bottom: 0.5rem; }
        input {
            width: 100%;
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 10px; padding: 0.85rem 1rem;
            color: var(--white);
            font-family: 'IBM Plex Sans', sans-serif; font-size: 1rem;
            outline: none; transition: border-color 0.2s;
        }
        input:focus { border-color: var(--teal); background: rgba(232, 90, 0, 0.04); }
        input::placeholder { color: var(--gray); }

        .btn-submit {
            width: 100%; background: var(--teal); color: var(--navy);
            border: none; border-radius: 10px; padding: 0.9rem;
            font-family: 'IBM Plex Sans', sans-serif; font-size: 1rem; font-weight: 600;
            cursor: pointer; transition: all 0.2s; margin-top: 0.5rem;
        }
        .btn-submit:hover { background: #FF8533; transform: translateY(-1px); }
        .btn-submit:disabled { background: rgba(232, 90, 0, 0.4); cursor: not-allowed; transform: none; }

        .error-msg {
            background: var(--red-dim); border: 1px solid rgba(255, 107, 107, 0.2);
            color: var(--red); border-radius: 8px; padding: 0.75rem 1rem;
            font-size: 0.875rem; margin-bottom: 1rem; display: none;
        }
        .error-msg.visible { display: block; }

        .info-box {
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.06);
            border-radius: 10px; padding: 1rem;
            font-size: 0.85rem; color: var(--gray); margin-bottom: 1.5rem;
            line-height: 1.6;
        }
        .info-box strong { color: var(--white); }

        .bottom-links { text-align: center; font-size: 0.875rem; color: var(--gray); margin-top: 1.5rem; }
        .bottom-links a { color: var(--teal); text-decoration: none; font-weight: 600; }

        .hint { font-size: 0.8rem; color: var(--gray); margin-top: 0.4rem; }

        /* Loading state */
        .loading-state { display: none; text-align: center; padding: 2rem; }
        .loading-state.visible { display: block; }
        .spinner {
            width: 40px; height: 40px;
            border: 3px solid rgba(232, 90, 0, 0.2);
            border-top-color: var(--teal);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 1rem;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>

<body>
    <div class="auth-card">
        <div class="auth-logo">
            <a href="/"><span class="logo-text">Canal<span class="logo-dot">Clear</span></span></a>
        </div>

        <div class="success-icon">🎉</div>
        <h1>Payment Confirmed!</h1>
        <p class="subtitle">Create your CanalClear account to access the <strong>VUMPA Filing Validator</strong>.</p>
        <div id="plan-pill" class="plan-pill" style="display:none"></div>

        <div id="error-msg" class="error-msg"></div>

        <div class="info-box">
            <strong>Important:</strong> Use the same email address you used during checkout. This is how we verify your subscription.
        </div>

        <form id="welcome-form">
            <div class="form-group">
                <label for="name">Your name</label>
                <input type="text" id="name" name="name" placeholder="Captain James Reid" autocomplete="name">
            </div>
            <div class="form-group">
                <label for="email">Email address (used at checkout)</label>
                <input type="email" id="email" name="email" placeholder="captain@vesselcorp.com" required autocomplete="email">
            </div>
            <div class="form-group">
                <label for="password">Create a password</label>
                <input type="password" id="password" name="password" placeholder="••••••••" required autocomplete="new-password">
                <div class="hint">Minimum 8 characters</div>
            </div>
            <div class="form-group">
                <label for="confirm-password">Confirm password</label>
                <input type="password" id="confirm-password" name="confirm_password" placeholder="••••••••" required autocomplete="new-password">
            </div>
            <button type="submit" class="btn-submit" id="submit-btn">Create Account & Enter Validator →</button>
        </form>

        <div class="bottom-links">
            Already set up your account? <a href="/login">Log in →</a>
        </div>
    </div>

    <script>
        const params = new URLSearchParams(window.location.search);
        const plan = params.get('plan');

        // Show plan badge
        const planNames = {
            agent_pro_panama: 'Agent Pro — Panama $599/mo',
            agent_pro_suez: 'Agent Pro — Suez $899/mo',
            agent_pro_bundle: 'Agent Pro — Both Canals $1,500/mo',
            ops_manager: 'Ops Manager — $399/vessel/mo'
        };
        if (plan && planNames[plan]) {
            const pill = document.getElementById('plan-pill');
            pill.textContent = '✓ ' + planNames[plan];
            pill.style.display = 'block';
        }

        // Meta Pixel — Purchase (fires once per landing, deduped via sessionStorage)
        var planPrices = { per_transit: 1500, monthly_pro: 5000, monthly_fleet: 10000, per_vessel: 300 };
        var _purchaseFiredKey = 'cc_px_purchase_' + plan;
        if (plan && planPrices[plan] && !sessionStorage.getItem(_purchaseFiredKey)) {
            sessionStorage.setItem(_purchaseFiredKey, '1');
            if (window.fbq) fbq('track', 'Purchase', { value: planPrices[plan], currency: 'USD' });
        }

        const form = document.getElementById('welcome-form');
        const errorMsg = document.getElementById('error-msg');
        const submitBtn = document.getElementById('submit-btn');

        function showError(msg) {
            errorMsg.textContent = msg;
            errorMsg.classList.add('visible');
        }

        form.addEventListener('submit', async (e) => {
            e.preventDefault();

            const name = document.getElementById('name').value.trim();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const confirm = document.getElementById('confirm-password').value;

            if (password !== confirm) {
                showError('Passwords do not match.');
                return;
            }
            if (password.length < 8) {
                showError('Password must be at least 8 characters.');
                return;
            }

            submitBtn.disabled = true;
            submitBtn.textContent = 'Setting up your account…';
            errorMsg.classList.remove('visible');

            try {
                const res = await fetch('/api/auth/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    credentials: 'include',
                    body: JSON.stringify({ email, password, name })
                });
                const data = await res.json();

                if (data.success) {
                    submitBtn.textContent = 'Success! Setting up your workspace…';
                    // Meta Pixel — Lead (account successfully created)
                    if (window.fbq) fbq('track', 'Lead');
                    // New users go to onboarding to add their first vessel; existing users go to app
                    const dest = (data.user && data.user.onboarding_completed) ? '/app' : '/onboarding';
                    setTimeout(() => { window.location.href = dest; }, 1000);
                } else {
                    if (data.redirect) {
                        setTimeout(() => {
                            window.location.href = data.redirect + (data.redirect.includes('?') ? '&' : '?') + 'from=welcome&email=' + encodeURIComponent(email);
                        }, 2000);
                    }
                    showError(data.message || 'Setup failed. Please try again.');
                    submitBtn.disabled = false;
                    submitBtn.textContent = 'Create Account & Enter Validator →';
                }
            } catch (err) {
                showError('Network error. Please try again.');
                submitBtn.disabled = false;
                submitBtn.textContent = 'Create Account & Enter Validator →';
            }
        });
    </script>

    <!-- CanalClear Analytics (shared module) -->
    <script src="/js/analytics.js"></script>
    <script>
    document.addEventListener('DOMContentLoaded', function() {
        var ccTrack = window._ccTrack || function(){};

        var form = document.getElementById('setup-form') || document.querySelector('form');
        if (form) {
            form.addEventListener('submit', function() {
                ccTrack('account_setup', {});
            });
        }

        // Track welcome page view (signals successful payment/registration)
        ccTrack('welcome_page_view', {});
    });
    </script>
